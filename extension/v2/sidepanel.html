<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Agent - Quick Save</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="panel-container">
    <!-- Header -->
    <header class="panel-header">
      <div class="header-content">
        <div class="logo">
          <div class="logo-icon">💼</div>
          <div>
            <h1>Job Agent</h1>
            <p class="tagline">Stop wasting time on jobs you'll never get</p>
          </div>
        </div>
        <button class="btn-icon" id="closeBtn" title="Close (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Status Message -->
    <div id="statusMessage" class="status-message" style="display: none;">
      <div class="status-content">
        <svg class="status-icon" viewBox="0 0 24 24">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span class="status-text"></span>
      </div>
    </div>

    <!-- Main Content -->
    <main class="panel-content">
      <!-- Auth Check -->
      <div id="authRequired" style="display: none;">
        <div class="empty-state">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <h3>Sign in required</h3>
          <p>Please sign in to save jobs</p>
          <button class="btn btn-primary" id="openLoginBtn">
            Open Job Agent
          </button>
        </div>
      </div>

      <!-- Main Form -->
      <div id="mainForm">
        <!-- Quick Actions -->
        <div class="quick-actions">
          <button class="quick-action-btn" id="pasteBtn" title="Paste from clipboard (Ctrl+V)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            </svg>
            Paste Clipboard
          </button>
          <button class="quick-action-btn" id="clearBtn" title="Clear form">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Clear
          </button>
        </div>

        <!-- Instructions -->
        <div class="instructions">
          <p>📋 Paste job descriptions from <strong>any source</strong></p>
          <p class="text-sm text-gray-600">LinkedIn, email, career pages, etc.</p>
        </div>

        <!-- Form -->
        <form id="jobForm">
          <!-- Job Title -->
          <div class="form-group">
            <label for="jobTitle">
              Job Title <span class="required">*</span>
            </label>
            <input
              type="text"
              id="jobTitle"
              placeholder="e.g., Software Engineer"
              required
            />
          </div>

          <!-- Company -->
          <div class="form-group">
            <label for="company">
              Company <span class="required">*</span>
            </label>
            <input
              type="text"
              id="company"
              placeholder="e.g., Google"
              required
            />
          </div>

          <!-- Description -->
          <div class="form-group">
            <label for="description">
              Job Description <span class="required">*</span>
              <button type="button" class="btn-hint" id="smartParseBtn" title="Detect from pasted text">
                ✨ Smart Parse
              </button>
            </label>
            <textarea
              id="description"
              rows="8"
              placeholder="Paste the full job description here...&#10;&#10;We'll automatically detect:&#10;• Skills&#10;• Responsibilities&#10;• Requirements"
              required
            ></textarea>
            <div class="char-count">
              <span id="charCount">0</span> characters
            </div>
          </div>

          <!-- Optional Details (Collapsible) -->
          <details class="optional-details">
            <summary>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
              Optional details
            </summary>

            <div class="optional-fields">
              <!-- Location -->
              <div class="form-group">
                <label for="location">Location</label>
                <input
                  type="text"
                  id="location"
                  placeholder="e.g., London, UK"
                />
              </div>

              <!-- Job Type -->
              <div class="form-group">
                <label for="jobType">Job Type</label>
                <select id="jobType">
                  <option value="">Select type</option>
                  <option value="Full-time">Full-time</option>
                  <option value="Part-time">Part-time</option>
                  <option value="Contract">Contract</option>
                  <option value="Internship">Internship</option>
                  <option value="Remote">Remote</option>
                  <option value="Hybrid">Hybrid</option>
                </select>
              </div>

              <!-- Salary -->
              <div class="form-group">
                <label for="salary">Salary Range</label>
                <input
                  type="text"
                  id="salary"
                  placeholder="e.g., $40,000 - $60,000"
                />
              </div>

              <!-- URL (Reference Only) -->
              <div class="form-group">
                <label for="url">
                  Reference URL
                  <span class="hint">For your reference only</span>
                </label>
                <input
                  type="url"
                  id="url"
                  placeholder="https://..."
                />
              </div>

              <!-- Notes -->
              <div class="form-group">
                <label for="notes">Personal Notes</label>
                <textarea
                  id="notes"
                  rows="3"
                  placeholder="Any notes about this job..."
                ></textarea>
              </div>
            </div>
          </details>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary btn-large" id="submitBtn">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            Save to Job Agent
          </button>
        </form>

        <!-- AI Insights (Optional) -->
        <div id="aiInsights" style="display: none;" class="ai-insights">
          <h3>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            AI Insights
          </h3>
          <div id="insightsContent"></div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="panel-footer">
      <div class="footer-links">
        <a href="#" id="viewJobsBtn">View All Jobs</a>
        <span class="separator">•</span>
        <a href="#" id="settingsBtn">Settings</a>
      </div>
      <div class="footer-info">
        <kbd>Alt</kbd> + <kbd>J</kbd> to toggle panel
      </div>
    </footer>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
