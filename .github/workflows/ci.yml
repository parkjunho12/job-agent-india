name: CI (Frontend/Backend) + Docker Build/Push

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
    tags:
      - "v*"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_GHCR: ghcr.io
  OWNER_REPO: ${{ github.repository }} # owner/repo
  DOCKERHUB_NAMESPACE: ghdlwnsgh12

jobs:
  # 1) 어떤 폴더가 바뀌었는지 판단 (frontend/backend)
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            # workflow / 공통파일 변경 시 둘 다 빌드하도록 하고 싶으면 아래처럼 추가 가능
            # common:
            #   - '.github/workflows/**'
            #   - 'docker-compose.yml'

  # 2) PR/Push 시 Backend CI (변경 있을 때만)
  backend-ci:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # # 선택: 린트/타입체크가 실제로 구성돼 있으면 활성화
      # - name: Lint (optional)
      #   run: |
      #   #  python -m compileall .
      #   # ruff/flake8/mypy 등을 쓰면 여기서 실행
      #   # 예) ruff check . || true

      - name: Tests (optional)
        run: |
          pytest -q || true
        # 테스트가 준비돼 있으면 "|| true" 제거

  # 3) PR/Push 시 Frontend CI (변경 있을 때만)
  frontend-ci:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      # # 선택: lint 스크립트가 있으면 실행
      # - name: Lint (optional)
      #   run: |
      #     npm run lint --if-present

      # 최소 빌드 검증 (Vite 기준)
      - name: Build
        working-directory: frontend
        run: npm run build

  # 4) Docker Build/Push (master push 또는 v* tag push일 때)
  docker-publish:
    needs: [changes, backend-ci, frontend-ci]
    if: >
      (github.event_name == 'push') &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]

    steps:
      - uses: actions/checkout@v4

      - name: Decide if this service should publish
        id: should
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "changed=${{ needs.changes.outputs.frontend }}" >> $GITHUB_OUTPUT
          else
            echo "changed=${{ needs.changes.outputs.backend }}" >> $GITHUB_OUTPUT
          fi

      # 변경이 없고 master push인 경우는 스킵
      # (단, v* 태그 릴리스는 강제로 둘 다 빌드하고 싶으면 아래 if를 제거하세요)
      - name: Skip if not changed (master only)
        if: steps.should.outputs.changed != 'true' && github.ref == 'refs/heads/master'
        run: |
          echo "No changes for ${{ matrix.service }}. Skipping publish."
          exit 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            docker.io/ghdlwnsgh12/job-agent-india-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag  # v0.3.7 같은 태그 푸시 시 자동으로 v0.3.7 태그 생성

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache || true
          docker system prune -af || true
          df -h

      - name: Build & Push (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
